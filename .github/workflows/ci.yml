name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast checks that need no database: repo tooling, hooks, migration immutability.
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Merged migrations are unchanged
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "New branch, nothing to compare against."
            exit 0
          fi
          scripts/check-migrations.sh "$BASE"

      - name: Hooks, guard scripts and Claude config (shellcheck + tests)
        run: scripts/tests/run.sh

  # The whole history, not just the diff: a secret removed in a later commit is still leaked.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks (full history)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.1.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Static checks (Edge Function)
        working-directory: supabase/functions/invite-member
        run: deno task check

      - name: Unit tests (Edge Function)
        working-directory: supabase/functions/invite-member
        run: deno test --allow-env

      - name: Start local stack
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,storage-api,realtime,postgres-meta,mailpit

      - name: Database lint and advisors
        run: |
          supabase db lint --level warning --fail-on warning
          supabase db advisors

      - name: Database tests (pgTAP)
        run: supabase test db

      - name: RLS on every table, allow and deny tests for every policy
        run: |
          scripts/check-rls-coverage.sh
          scripts/tests/check-rls-coverage.test.sh

      - name: Concurrency and config tests
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          cd supabase/tests/deno
          deno lint && deno fmt --check
          DB_URL="$DB_URL" deno task test

      - name: PL/pgSQL coverage (100% statements and branches)
        run: scripts/plpgsql-coverage.sh 100

      - name: Edge Function tests with coverage (unit, adapters, end to end; 100%)
        run: |
          supabase functions serve --env-file supabase/functions/.env.example > serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null -X OPTIONS "http://127.0.0.1:54321/functions/v1/invite-member" && break
            sleep 2
          done
          scripts/ts-coverage.sh

      - name: Function logs
        if: failure()
        run: cat serve.log || true
